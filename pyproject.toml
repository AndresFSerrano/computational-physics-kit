[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "computational-physics-kit"
version = "0.1.0"
description = "Finite differences and finite elements for the problems of an undergraduate computational physics course"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrés Felipe Serrano Barrios" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.8"]
keywords = ["finite differences", "finite elements", "laplace", "diffusion", "schrodinger", "physics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/computational_physics_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
